<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaSify - Create Your Account</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            background-color: #0b0f19;
        }
        .gradient-glow {
            background: radial-gradient(circle at 50% -20%, rgba(99, 102, 241, 0.15) 0%, rgba(0, 0, 0, 0) 50%);
        }
    </style>
</head>
<body class="text-gray-100 font-sans min-h-screen flex flex-col justify-between gradient-glow relative overflow-x-hidden">

    <!-- Top Navigation Header -->
    <header class="w-full max-w-7xl mx-auto px-6 py-6 flex justify-between items-center z-10">
        <a href="index.html" class="flex items-center space-x-2 text-xl font-bold tracking-tight text-white hover:opacity-90 transition">
            <div class="h-8 w-8 rounded-lg bg-indigo-600 flex items-center justify-center shadow-md shadow-indigo-500/20">
                <span class="text-white font-black text-sm">S</span>
            </div>
            <span>SaaSify</span>
        </a>
        <a href="index.html" class="text-sm font-medium text-gray-400 hover:text-white transition">
            <i class="fa-solid fa-arrow-left mr-2"></i>Back to home
        </a>
    </header>

    <!-- Main Registration Container -->
    <main class="flex-grow flex items-center justify-center px-4 py-12 relative z-10">
        <!-- Abstract Background Decorative Elements -->
        <div class="absolute top-1/2 left-1/4 -translate-y-1/2 -translate-x-1/2 w-72 h-72 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute top-1/3 right-1/4 -translate-y-1/2 translate-x-1/2 w-96 h-96 bg-purple-500/5 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Signup Card Wrapper -->
        <div class="w-full max-w-md bg-gray-900/60 backdrop-blur-xl border border-gray-800/80 rounded-2xl p-8 shadow-2xl shadow-black/40">
            
            <!-- Header Section -->
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-white tracking-tight">Create your account</h1>
                <p class="text-gray-400 text-sm mt-2">Get started with your 14-day free trial tier.</p>
            </div>

            <!-- Social SSO Logins -->
            <div class="grid grid-cols-2 gap-3 mb-6">
                <button type="button" class="flex items-center justify-center space-x-2 bg-gray-800/50 hover:bg-gray-800 border border-gray-700/60 hover:border-gray-600 text-gray-200 py-2.5 px-4 rounded-xl text-sm font-medium transition duration-200">
                    <i class="fa-brands fa-google text-red-400"></i>
                    <span>Google</span>
                </button>
                <button type="button" class="flex items-center justify-center space-x-2 bg-gray-800/50 hover:bg-gray-800 border border-gray-700/60 hover:border-gray-600 text-gray-200 py-2.5 px-4 rounded-xl text-sm font-medium transition duration-200">
                    <i class="fa-brands fa-github text-white"></i>
                    <span>GitHub</span>
                </button>
            </div>

            <!-- Visual Separator Line -->
            <div class="relative flex items-center justify-center my-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-800"></div>
                </div>
                <span class="relative px-3 bg-[#0e1322] text-xs font-semibold text-gray-500 uppercase tracking-wider">Or register with email</span>
            </div>

            <!-- Registration Data Form -->
            <form action="#" method="POST" class="space-y-5">
                <!-- Name Field Row -->
                <div>
                    <label for="name" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Full Name</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-500">
                            <i class="fa-regular fa-user text-sm"></i>
                        </span>
                        <input type="text" id="name" name="name" required placeholder="John Doe" 
                            class="w-full bg-gray-950 border border-gray-800 rounded-xl py-2.5 pl-10 pr-4 text-sm text-gray-100 placeholder-gray-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition duration-200">
                    </div>
                </div>

                <!-- Email Field Row -->
                <div>
                    <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Email Address</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-500">
                            <i class="fa-regular fa-envelope text-sm"></i>
                        </span>
                        <input type="email" id="email" name="email" required placeholder="name@company.com" 
                            class="w-full bg-gray-950 border border-gray-800 rounded-xl py-2.5 pl-10 pr-4 text-sm text-gray-100 placeholder-gray-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition duration-200">
                    </div>
                </div>

                <!-- Password Field Row -->
                <div>
                    <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-500">
                            <i class="fa-solid fa-lock text-sm"></i>
                        </span>
                        <input type="password" id="password" name="password" required placeholder="••••••••" 
                            class="w-full bg-gray-950 border border-gray-800 rounded-xl py-2.5 pl-10 pr-4 text-sm text-gray-100 placeholder-gray-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition duration-200">
                    </div>
                </div>

                <!-- Terms & Conditions Checkbox Alignment -->
                <div class="flex items-start">
                    <div class="flex items-center h-5">
                        <input id="terms" name="terms" type="checkbox" required 
                            class="h-4 w-4 bg-gray-950 border-gray-800 rounded text-indigo-600 focus:ring-offset-gray-900 focus:ring-indigo-500">
                    </div>
                    <div class="ml-3 text-xs">
                        <label id="terms-label" for="terms" class="text-gray-400">
                            I accept the <a href="#" class="text-indigo-400 hover:text-indigo-300 font-medium transition">Terms of Service</a> and <a href="#" class="text-indigo-400 hover:text-indigo-300 font-medium transition">Privacy Policy</a>.
                        </label>
                    </div>
                </div>

                <!-- Action Submit Button -->
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-4 rounded-xl text-sm shadow-lg shadow-indigo-600/20 hover:shadow-indigo-600/30 transition duration-200 transform active:scale-[0.99]">
                    Create Free Account
                </button>
            </form>

            <!-- Navigation Redirect Footnote -->
            <div class="text-center mt-6">
                <p class="text-sm text-gray-400">
                    Already have an account? 
                    <a href="#" class="text-indigo-400 hover:text-indigo-300 font-semibold transition ml-1">Sign in instead</a>
                </p>
            </div>

        </div>
    </main>

    <!-- Structural Minimalist Footer Context -->
    <footer class="w-full py-6 text-center text-xs text-gray-600 border-t border-gray-900/60">
        <p>&copy; 2026 SaaSify Inc. All rights reserved.</p>
    </footer>

</body>
</html>
