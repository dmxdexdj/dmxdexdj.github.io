<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1c1e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #2a2d32;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            max-width: 350px;
            width: 100%;
        }
        h1 { margin-bottom: 5px; font-size: 24px; }
        p { color: #b9bbbe; margin-bottom: 20px; }
        .btn {
            display: block;
            background-color: #5865F2; /* Discord Purple */
            color: white;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #4752c4; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Welcome to My Space</h1>
        <p>Check out my profile and links below!</p>
        <!-- You can change these links to your actual social profiles later -->
        <a href="#" class="btn">My Projects</a>
        <a href="#" class="btn">Twitter / X</a>
    </div>
</body>
</html>
