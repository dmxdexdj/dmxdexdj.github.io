<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404: packet lost | Packet Park</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F1EEFF">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1EEFF;--ink:#1B1740;--blue:#3D4BFF;--pink:#FF5C8A;--sun:#FFD23F;--white:#fff;--muted:#5C587D;
--display:'Unbounded','Arial Black',Arial,sans-serif;--body:'DM Sans','Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
:focus-visible{outline:3px solid var(--pink);outline-offset:3px;border-radius:8px}
.wrap{max-width:1100px;width:100%;margin:0 auto;padding:0 24px}
header{padding:28px 0}
.logo{font-family:var(--display);font-weight:700;font-size:18px;display:inline-flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none}
.logo i{width:22px;height:22px;background:var(--sun);border:2.5px solid var(--ink);border-radius:6px;display:inline-block;transform:rotate(-8deg)}
main{flex:1;display:grid;place-items:center;padding:12px 0 32px}
.card{width:100%;max-width:720px;background:var(--white);border:2.5px solid var(--ink);border-radius:28px;box-shadow:7px 7px 0 var(--ink);overflow:hidden}
.route{position:relative;height:150px;background:#FBFAFF;border-bottom:2.5px solid var(--ink);overflow:hidden}
.line{position:absolute;left:12%;right:12%;top:68px;border-top:3px dashed var(--ink);opacity:.35}
.node{position:absolute;top:50px;width:38px;height:38px;border:2.5px solid var(--ink);border-radius:50%;background:var(--white);display:grid;place-items:center;font-size:17px;box-shadow:2px 2px 0 var(--ink)}
.n1{left:calc(12% - 19px)} .n2{left:calc(37% - 19px)} .n3{left:calc(62% - 19px)}
.n4{left:calc(88% - 19px);border-style:dashed;box-shadow:none;background:transparent;color:var(--pink);font-family:var(--display);font-weight:700}
.cut{position:absolute;left:calc(75% - 14px);top:52px;font-family:var(--display);font-weight:700;font-size:26px;color:var(--pink);line-height:1;transform:rotate(-6deg)}
.pkt{position:absolute;left:calc(12% - 12px);top:56px;width:24px;height:24px;background:var(--sun);border:2.5px solid var(--ink);border-radius:6px;transform:rotate(-8deg);animation:hop 4.2s infinite}
@keyframes hop{
 0%{left:calc(12% - 12px);top:56px;opacity:0;transform:rotate(-8deg) scale(.6)}
 8%{opacity:1;transform:rotate(-8deg) scale(1)}
 30%{left:calc(37% - 12px);top:56px}
 55%{left:calc(62% - 12px);top:56px;opacity:1;transform:rotate(-8deg)}
 68%{left:calc(74% - 12px);top:50px;opacity:1;transform:rotate(14deg)}
 100%{left:calc(80% - 12px);top:190px;opacity:0;transform:rotate(120deg)}}
.body{padding:28px 28px 32px;text-align:center}
.code{font-family:var(--display);font-weight:700;font-size:clamp(64px,16vw,120px);line-height:1;letter-spacing:-.05em}
.code span{color:var(--pink)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(20px,3.4vw,28px);letter-spacing:-.04em;line-height:1.15;margin-top:10px}
.lead{margin:12px auto 0;color:var(--muted);font-size:17px;max-width:44ch}
.err{display:inline-block;margin-top:16px;font:600 13px ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:2px solid var(--ink);border-radius:999px;padding:3px 12px}
.act{margin-top:24px}
a.btn{display:inline-block;font:inherit;font-weight:700;font-size:16px;color:#fff;background:var(--blue);text-decoration:none;padding:12px 22px;border-radius:12px;border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);transition:transform .1s,box-shadow .1s}
a.btn:hover{transform:translate(-1px,-2px);box-shadow:4px 5px 0 var(--ink)}
a.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
footer{padding:0 0 40px;color:var(--muted);font-size:14px}
footer a{color:var(--ink);font-weight:700}
.divider{display:flex;align-items:center;gap:14px}
.divider::before,.divider::after{content:"";flex:1;border-top:2.5px dashed var(--ink);opacity:.35}
.divider i{width:18px;height:18px;background:var(--sun);border:2.5px solid var(--ink);border-radius:5px;display:block;transform:rotate(-8deg)}
.foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px 24px;margin-top:22px}
.foot .links{display:flex;gap:18px;flex-wrap:wrap}
::-webkit-scrollbar{width:14px;height:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.pkt{animation:none;left:calc(62% - 12px);top:56px}}
</style>
</head>
<body>
<div class="wrap">
  <header><a class="logo" href="/"><i></i>Packet Park</a></header>
</div>
<main class="wrap">
  <div class="card">
    <div class="route" aria-hidden="true">
      <div class="line"></div>
      <div class="node n1">🏠</div><div class="node n2">📡</div><div class="node n3">📡</div>
      <div class="cut">✕</div>
      <div class="node n4">?</div>
      <div class="pkt"></div>
    </div>
    <div class="body">
      <div class="code">4<span>0</span>4</div>
      <h1>Your packet got lost</h1>
      <p class="lead">It hopped through a few routers, but this page isn't at the end of the line.</p>
      <p class="err" role="note">destination unreachable: no route to host</p>
      <div class="act"><a class="btn" href="/">Take me home</a></div>
    </div>
  </div>
</main>
<div class="wrap">
  <footer>
    <div class="divider" aria-hidden="true"><i></i></div>
    <div class="foot">
      <span>Made by <a href="https://github.com/dmxdexdj">dmxdexdj</a></span>
      <span class="links"><a href="/">Home</a><a href="mailto:hello@packetpark.wingnode.org">Email me</a></span>
    </div>
  </footer>
</div>
</body>
</html>
